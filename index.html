<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joseph Yu's Live Resume</title>

    <header style="background-color: black; color: white; padding: 16px; font-family: Arial, sans-serif; font-size: 40px;" class="site-header"><div class="inner">Background</div></header>

    <style>
      * { box-sizing: border-box; }

      .box {
        width: 320px;          
        padding: 16px;         
        border: 4px solid black;
        margin: 0;
      }
      .layout {
        display: flex;
        align-items: flex-start;
        gap: 16px;
        justify-content: center;
        margin: 25px auto;
        max-width: 820px;
        padding: 0 16px;
      }
      .profile {
        width: 160px;
        height: 160px;
        object-fit: cover;
        border-radius: 8px;
      }
      .intro-text {
        font-size: 16px;
        font-family: Arial, sans-serif;
        color: black;
        margin-top: 8px;
      }
    </style>
  </head>
    <body>
    <div class="layout">
      <img src="images/me.jpg" alt="Joseph Yu" class="profile">
      <div class="box">
        <h2 style="color: black; font-family: Arial, sans-serif; font-size: 32px;">Introduction</h2>
        <hr/>
        <p class="intro-text">Hey I am Joseph Yu!</p>
      </div>
    </div>
  </body>
</html>
